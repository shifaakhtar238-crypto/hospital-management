<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Appointments</title>

<style>
body{font-family:Arial;background:#f5f7fa;}
.container{padding:30px;}
.box{background:white;padding:20px;border-radius:10px;margin-bottom:20px;}
input,select,button{width:100%;padding:10px;margin:8px 0;}
button{background:#2c7be5;color:white;border:none;cursor:pointer;}
table{width:100%;background:white;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ddd;}
th{background:#2c7be5;color:white;}
</style>
</head>

<body>

<div class="container">

<h2>Book Appointment</h2>

<div class="box">
<form id="form">
<input id="name" placeholder="Name">

<select id="doctor">
<option value="Dr. Sharma">Dr. Sharma</option>
<option value="Dr. Khan">Dr. Khan</option>
</select>

<input type="date" id="date">
<input type="time" id="time">

<button type="submit">Book</button>
</form>
</div>

<table id="table">
<tr>
<th>Name</th>
<th>Doctor</th>
<th>Date</th>
<th>Time</th>
<th>Action</th>
</tr>
</table>

</div>

<script>

const BASE_URL = "https://hospital-management-d8lo.onrender.com";
const token = localStorage.getItem("token");

if(!token){
    alert("Login first");
    window.location.href = "login.html";
}

// ================= BOOK =================
document.getElementById("form").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value.trim(),
        doctor: document.getElementById("doctor").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value
    };

    if(!data.name || !data.date || !data.time){
        alert("All fields required");
        return;
    }

    try {
        const res = await fetch(`${BASE_URL}/api/appointments`, {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+token
            },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if(!res.ok){
            alert(result.message || "Booking failed");
            return;
        }

        alert(result.message || "Booked Successfully");

        document.getElementById("form").reset();

        load();

    } catch (err) {
        alert("Server error");
        console.log(err);
    }
});


// ================= LOAD =================
async function load(){

    try {
        const res = await fetch(`${BASE_URL}/api/appointments`, {
            headers:{ "Authorization":"Bearer "+token }
        });

        const data = await res.json();

        const table = document.getElementById("table");

        table.innerHTML = `
        <tr>
        <th>Name</th><th>Doctor</th><th>Date</th><th>Time</th><th>Action</th>
        </tr>
        `;

        if(!Array.isArray(data)) return;

        data.forEach(a=>{
            table.innerHTML += `
            <tr>
            <td>${a.name}</td>
            <td>${a.doctor || "N/A"}</td>
            <td>${a.date}</td>
            <td>${a.time}</td>
            <td><button onclick="cancelAppointment(${a.id})">Cancel</button></td>
            </tr>
            `;
        });

    } catch (err) {
        console.log(err);
    }
}


// ================= CANCEL =================
async function cancelAppointment(id){

    try {
        await fetch(`${BASE_URL}/api/appointments/cancel/${id}`, {
            method:"PUT",
            headers:{ "Authorization":"Bearer "+token }
        });

        load();

    } catch (err) {
        console.log(err);
    }
}

load();

</script>

</body>
</html>
