<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Appointments</title>

<style>
body{
    font-family:Arial;
    background:#f5f7fa;
    margin:0;
}

/* LOGOUT BUTTON */
.logout{
    position:fixed;
    bottom:10px;
    right:10px;
    background:#e74c3c;
    color:white;
    border:none;
    padding:4px 10px;
    font-size:12px;
    border-radius:4px;
    cursor:pointer;
    z-index:999;
}

.logout:hover{
    background:#c0392b;
}

/* CONTAINER */
.container{
    max-width:500px;
    margin:60px auto 20px;
    padding:0 10px;
}

/* BOX */
.box{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

/* INPUTS */
input,select,button{
    width:100%;
    padding:8px;
    margin:5px 0;
    font-size:13px;
    box-sizing:border-box;
}

/* BUTTON */
button{
    background:#2c7be5;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

button:hover{
    background:#1a5fd0;
}

button:disabled{
    background:gray;
}

/* TABLE */
table{
    width:100%;
    background:white;
    border-collapse:collapse;
}

th,td{
    padding:7px;
    border-bottom:1px solid #ddd;
    text-align:center;
    font-size:13px;
}

th{
    background:#2c7be5;
    color:white;
}

/* HEADINGS */
h2,h3{
    text-align:center;
    margin:10px 0;
}
</style>
</head>

<body>

<!-- LOGOUT -->
<button class="logout" onclick="logout()">Logout</button>

<div class="container">

<h2>Book Appointment</h2>

<div class="box">
<form id="form">

<input id="name" placeholder="Name" readonly>

<!-- DOCTORS -->
<select id="doctor">
<option value="Dr. Sharma (Cardiologist)">Dr. Sharma - Cardiologist</option>
<option value="Dr. Khan (Neurologist)">Dr. Khan - Neurologist</option>
<option value="Dr. Mehta (Orthopedic)">Dr. Mehta - Orthopedic</option>
</select>

<input type="date" id="date">
<input type="time" id="time">

<button type="submit">Book</button>

</form>
</div>

<h3>Your Appointments</h3>

<div class="box">
<table id="table">
<tr>
<th>Name</th>
<th>Doctor</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>
</div>

</div>

<script>

const BASE_URL = "https://hospital-management-d8lo.onrender.com";

// AUTH CHECK
const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

if(!token || !user){
    alert("Login first");
    window.location.href = "login.html";
}

document.getElementById("name").value = user.name;

// LOGOUT
function logout(){
    localStorage.clear();
    window.location.href = "login.html";
}

// BOOK
document.getElementById("form").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const btn = e.target.querySelector("button");
    btn.disabled = true;
    btn.innerText = "Booking...";

    const data = {
        name: user.name,
        doctor: document.getElementById("doctor").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        status: "pending"   
    };

    if(!data.date || !data.time){
        alert("All fields required");
        btn.disabled = false;
        btn.innerText = "Book";
        return;
    }

    try {
        const res = await fetch(`${BASE_URL}/api/appointments`, {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+token
            },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if(res.status === 401){
            alert("Session expired");
            localStorage.clear();
            window.location.href = "login.html";
            return;
        }

        if(!res.ok){
            alert(result.message || "Booking failed");
        } else {
            alert("Booked Successfully");
            document.getElementById("form").reset();
        }

        load();

    } catch (err) {
        alert("Server error");
    }

    btn.disabled = false;
    btn.innerText = "Book";
});

// LOAD
async function load(){

    const res = await fetch(`${BASE_URL}/api/appointments`, {
        headers:{ "Authorization":"Bearer "+token }
    });

    const data = await res.json();

    const table = document.getElementById("table");

    table.innerHTML = `
    <tr>
    <th>Name</th>
    <th>Doctor</th>
    <th>Date</th>
    <th>Time</th>
    <th>Status</th>
    <th>Action</th>
    </tr>
    `;

    if(!Array.isArray(data)) return;

    data.forEach(a=>{
        table.innerHTML += `
        <tr>
        <td>${a.name}</td>
        <td>${a.doctor || "Not Set"}</td>
        <td>${a.date}</td>
        <td>${a.time}</td>
        <td>${a.status || "pending"}</td>
        <td><button onclick="cancelAppointment(${a.id})" style="background:#e74c3c;font-size:12px;padding:4px 8px;">Cancel</button></td>
        </tr>
        `;
    });
}

// CANCEL
async function cancelAppointment(id){

    const ok = confirm("Cancel this appointment?");
    if(!ok) return;

    await fetch(`${BASE_URL}/api/appointments/cancel/${id}`, {
        method:"PUT",
        headers:{ "Authorization":"Bearer "+token }
    });

    load();
}

load();

</script>

</body>
</html>
