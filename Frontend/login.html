<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hospital Login</title>

<style>
body{
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right,#2c7be5,#6ea8ff);
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:320px;
}

input,select,button{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    background:#2c7be5;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Login</h2>

<div id="loginBox">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div id="registerBox" style="display:none;">
    <input id="regName" placeholder="Name">
    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">

    <select id="regRole">
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
    </select>

    <button onclick="register()">Register</button>
</div>

<button onclick="toggle()">Switch Login/Register</button>

</div>

<script>

// ================= BASE URL =================
const BASE_URL = "https://hospital-management-d8lo.onrender.com";

let isLogin = true;

function toggle(){
    isLogin = !isLogin;

    document.getElementById("loginBox").style.display = isLogin ? "block" : "none";
    document.getElementById("registerBox").style.display = isLogin ? "none" : "block";
    document.getElementById("title").innerText = isLogin ? "Login" : "Register";
}


// ================= REGISTER =================
async function register(){

    const data = {
        name: document.getElementById("regName").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        password: document.getElementById("regPassword").value,
        role: document.getElementById("regRole").value
    };

    if(!data.name || !data.email || !data.password || !data.role){
        alert("All fields required");
        return;
    }

    try {
        const res = await fetch(`${BASE_URL}/api/auth/register`, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if(!res.ok){
            alert(result.message || "Registration failed");
            return;
        }

        alert(result.message || "Registered Successfully");

        // auto switch to login
        toggle();

    } catch (err) {
        alert("Server not reachable");
        console.log(err);
    }
}


// ================= LOGIN =================
async function login(){

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if(!email || !password){
        alert("Email and password required");
        return;
    }

    try {
        const res = await fetch(`${BASE_URL}/api/auth/login`, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if(!res.ok){
            alert(data.message || "Login failed");
            return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        alert("Login Successful");

        window.location.href = "appointment.html";

    } catch (err) {
        alert("Server error or backend not running");
        console.log(err);
    }
}

</script>

</body>
</html>
